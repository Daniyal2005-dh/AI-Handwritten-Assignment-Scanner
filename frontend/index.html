<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Assignment Scanner</title>
  <meta name="description" content="Convert photos of handwritten assignments into editable text, searchable PDFs and DOCX." />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="AI Scanner" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Go to dashboard">
      <span class="brand-badge">AI</span>
      Handwritten Assignment Scanner
    </a>
    <div class="topbar-actions">
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
      <button id="install-btn" class="ghost small" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        Install app
      </button>
      <span id="status-pill" class="pill" title="Recognition provider">…</span>
    </div>
  </header>

  <main id="view" class="container"></main>

  <footer class="footer">
    Upload → Enhance → Recognize → Review → Export
    <span id="footer-meta"></span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
